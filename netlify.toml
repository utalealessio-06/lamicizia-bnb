[build]
  publish = "docs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Intestazioni di sicurezza per tutto il sito.
# CSP: solo script nostri; la mappa Google si carica solo dopo il consenso (iframe google.com);
# le foto profilo delle recensioni arrivano da googleusercontent.com; il pagamento avviene su stripe.com (redirect).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# La pagina riservata non va indicizzata né salvata in cache
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/grazie*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
